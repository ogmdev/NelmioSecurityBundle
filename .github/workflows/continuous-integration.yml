name: Continuous Integration

on: [push, pull_request]

jobs:
  tests:
    name: PHP ${{ matrix.php-version }} + Symfony ${{ matrix.symfony-version }} + ${{ matrix.dependencies }}

    runs-on: ubuntu-latest

    env:
      SYMFONY_REQUIRE: ${{ matrix.symfony-version }}

    strategy:
      matrix:
        php-version:
          - 8.4
          - 8.5
        symfony-version:
          - 5.4.*
          - 6.4.*
          - 7.4.*
          - 8.1.*
          - 8.2.*
        dependencies:
          - highest
        include:
          - php-version: 8.4
            dependencies: lowest
            symfony-version: 5.4.*
          - symfony-version: 8.2.*
            minimum-stability: RC

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          coverage: pcov
          ini-values: memory_limit=-1, date.timezone=Europe/Paris, session.gc_probability=0
          php-version: ${{ matrix.php-version }}
          tools: flex

      - name: Allow Symfony ${{ matrix.symfony-version }} pre-releases
        if: matrix.minimum-stability
        run: composer config minimum-stability ${{ matrix.minimum-stability }} && composer config prefer-stable true

      - name: Install Composer dependencies (${{ matrix.dependencies }})
        uses: ramsey/composer-install@v2
        with:
            dependency-versions: ${{ matrix.dependencies }}

      - name: Run tests
        run: vendor/bin/phpunit --coverage-clover coverage.xml

      - name: Send coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: coverage.xml
